<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>👤 Criar conta</h1>

        <form id="formCadastro">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <div id="mensagem"></div>

    </div>


    <script>

        const API_URL =
            "https://cardapio-restaurante-za9s.onrender.com";


        const form =
            document.getElementById("formCadastro");

        const mensagem =
            document.getElementById("mensagem");


        form.addEventListener(
            "submit",
            async function(evento) {

                evento.preventDefault();


                const nome =
                    document.getElementById("nome")
                        .value
                        .trim();

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const senha =
                    document.getElementById("senha")
                        .value;


                mensagem.textContent =
                    "Criando conta...";


                try {

                    const resposta =
                        await fetch(
                            `${API_URL}/usuarios`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    nome,
                                    email,
                                    senha
                                })
                            }
                        );


                    const dados =
                        await resposta.json();


                    if (!resposta.ok) {

                        throw new Error(
                            dados.erro ||
                            "Erro ao criar conta."
                        );

                    }

localStorage.setItem("usuario", JSON.stringify(dados.usuario));

localStorage.setItem("token", dados.token);

                    mensagem.textContent =
                        "✅ Conta criada com sucesso!";


                    form.reset();


                } catch (erro) {

                    console.error(erro);

                    mensagem.textContent =
                        "❌ " + erro.message;

                }

            }
        );

    </script>

</body>

</html>
