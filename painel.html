<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel - Estabelecimentos</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            opacity: 0.8;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .topo h2 {
            margin: 0;
        }

        .botao-novo {
            border: none;
            background: #222;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .botao-novo:hover {
            opacity: 0.9;
        }

        #listaEstabelecimentos {
            display: grid;
            gap: 20px;
        }

        .estabelecimento {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .estabelecimento h3 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .id {
            color: #777;
            margin-bottom: 18px;
        }

        .acoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .botao {
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .abrir {
            background: #222;
            color: white;
        }

        .carregando,
        .erro,
        .vazio {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .erro {
            color: #a00;
        }

        @media (max-width: 600px) {

            .topo {
                flex-direction: column;
                align-items: stretch;
            }

            .botao-novo {
                width: 100%;
            }

        }
        
.excluir {
    background: #dc3545;
    color: white;
}

.excluir:hover {
    opacity: 0.9;
}

    </style>

</head>


<body>

    <header>

        <h1>🏪 Painel Administrativo</h1>

        <p>
            Gerenciamento de estabelecimentos
        </p>

    </header>


    <main class="container">

        <div class="topo">

            <h2>
                Meus estabelecimentos
            </h2>

            <button
                class="botao-novo"
                onclick="novoEstabelecimento()"
            >
                + Nova Lanchonete
            </button>

        </div>


        <div id="listaEstabelecimentos">

            <div class="carregando">
                Carregando estabelecimentos...
            </div>

        </div>

    </main>


    <script>

        const API_URL =
            "https://cardapio-restaurante-za9s.onrender.com";


        // ======================================
        // CARREGAR ESTABELECIMENTOS
        // ======================================

        async function carregarEstabelecimentos() {

            const lista =
                document.getElementById(
                    "listaEstabelecimentos"
                );

            try {

                const resposta =
                    await fetch(
                        `${API_URL}/estabelecimentos`
                    );


                if (!resposta.ok) {

                    throw new Error(
                        `Erro HTTP ${resposta.status}`
                    );

                }


                const estabelecimentos =
                    await resposta.json();


                if (
                    !Array.isArray(
                        estabelecimentos
                    )
                ) {

                    throw new Error(
                        "A API não retornou uma lista."
                    );

                }


                if (
                    estabelecimentos.length === 0
                ) {

                    lista.innerHTML = `
                        <div class="vazio">
                            Nenhum estabelecimento cadastrado.
                        </div>
                    `;

                    return;
                }


                lista.innerHTML =
                    estabelecimentos
                        .map(
                            estabelecimento => {

                                return `

                                    <div
                                        class="estabelecimento"
                                    >

                                        <h3>
                                            🏪
                                            ${escaparHTML(
                                                estabelecimento.nome
                                            )}
                                        </h3>

                                        <div class="id">

                                            ID:
                                            ${estabelecimento.id}

                                        </div>

                                        <div class="acoes">

    <button
        class="botao abrir"
        onclick="abrirCardapio(${estabelecimento.id})"
    >
        🍽️ Abrir cardápio
    </button>

    <button
        class="botao excluir"
        onclick="excluirEstabelecimento(${estabelecimento.id})"
    >
        🗑️ Excluir
    </button>

</div>

</div>
                                `;

                            }
                        )
                        .join("");


            } catch (erro) {

                console.error(erro);

                lista.innerHTML = `

                    <div class="erro">

                        ❌ Erro ao carregar
                        estabelecimentos.

                        <br><br>

                        ${escaparHTML(
                            erro.message
                        )}

                    </div>

                `;

            }

        }


        // ======================================
        // ABRIR CARDÁPIO
        // ======================================

        function abrirCardapio(id) {

            window.location.href =
                `/?estabelecimento=${id}`;

        }


        // ======================================
        // NOVO ESTABELECIMENTO
        // ======================================

        function novoEstabelecimento() {

            window.location.href =
                "/admin-estabelecimento.html";

        }


        // ======================================
        // SEGURANÇA HTML
        // ======================================

        function escaparHTML(texto) {

            return String(texto ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ======================================
        // INICIAR
        // ======================================

        carregarEstabelecimentos();

    </script>

</body>

</html>
