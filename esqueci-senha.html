<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Redefinir senha</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px rgba(0,0,0,.1);

        }


        h1 {

            text-align: center;

            margin: 0 0 10px;

        }


        .descricao {

            text-align: center;

            color: #666;

            line-height: 1.5;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #222;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            opacity: .9;

        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        #mensagem {

            margin-top: 18px;

            text-align: center;

            font-weight: bold;

            line-height: 1.4;

        }


        .voltar {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #222;

            text-decoration: none;

        }


        .voltar:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>
            🔐 Redefinir senha
        </h1>


        <p class="descricao">

            Digite seu e-mail, o código de recuperação
            e escolha uma nova senha.

        </p>


        <form id="formRedefinirSenha">


            <!-- E-MAIL -->

            <label for="email">
                E-mail
            </label>


            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >


            <!-- CÓDIGO -->

            <label for="codigo">
                Código de recuperação
            </label>


            <input
                type="password"
                id="codigo"
                placeholder="Digite o código"
                required
            >


            <!-- NOVA SENHA -->

            <label for="novaSenha">
                Nova senha
            </label>


            <input
                type="password"
                id="novaSenha"
                placeholder="Digite a nova senha"
                minlength="6"
                required
            >


            <!-- CONFIRMAR SENHA -->

            <label for="confirmarSenha">
                Confirmar nova senha
            </label>


            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite a senha novamente"
                minlength="6"
                required
            >


            <button
                type="submit"
                id="botao"
            >
                Redefinir senha
            </button>


        </form>


        <div id="mensagem"></div>


        <a
            class="voltar"
            href="/index.html"
        >
            ← Voltar para o login
        </a>


    </div>


    <script>


        // ======================================
        // CONFIGURAÇÃO
        // ======================================

        const API_URL =
            "https://cardapio-restaurante-za9s.onrender.com";


        // ======================================
        // ELEMENTOS
        // ======================================

        const form =
            document.getElementById(
                "formRedefinirSenha"
            );


        const email =
            document.getElementById(
                "email"
            );


        const codigo =
            document.getElementById(
                "codigo"
            );


        const novaSenha =
            document.getElementById(
                "novaSenha"
            );


        const confirmarSenha =
            document.getElementById(
                "confirmarSenha"
            );


        const mensagem =
            document.getElementById(
                "mensagem"
            );


        const botao =
            document.getElementById(
                "botao"
            );


        // ======================================
        // REDEFINIR SENHA
        // ======================================

        form.addEventListener(
            "submit",
            async function(evento) {

                evento.preventDefault();


                const emailValor =
                    email.value
                        .trim()
                        .toLowerCase();


                const codigoValor =
                    codigo.value.trim();


                const novaSenhaValor =
                    novaSenha.value;


                const confirmarSenhaValor =
                    confirmarSenha.value;


                // ==================================
                // VALIDAR SENHAS
                // ==================================

                if (
                    novaSenhaValor !==
                    confirmarSenhaValor
                ) {

                    mensagem.textContent =
                        "❌ As senhas não são iguais.";

                    return;

                }


                // ==================================
                // TAMANHO DA SENHA
                // ==================================

                if (
                    novaSenhaValor.length < 6
                ) {

                    mensagem.textContent =
                        "❌ A senha deve ter pelo menos 6 caracteres.";

                    return;

                }


                // ==================================
                // CARREGANDO
                // ==================================

                botao.disabled = true;

                botao.textContent =
                    "Redefinindo...";


                mensagem.textContent =
                    "Aguarde...";


                try {


                    // ==================================
                    // ENVIAR PARA API
                    // ==================================

                    const resposta =
                        await fetch(
                            `${API_URL}/redefinir-senha`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        email:
                                            emailValor,

                                        novaSenha:
                                            novaSenhaValor,

                                        codigo:
                                            codigoValor

                                    })

                            }
                        );


                    // ==================================
                    // LER RESPOSTA
                    // ==================================

                    const dados =
                        await resposta.json();


                    // ==================================
                    // ERRO
                    // ==================================

                    if (!resposta.ok) {

                        throw new Error(
                            dados.erro ||
                            "Não foi possível redefinir a senha."
                        );

                    }


                    // ==================================
                    // SUCESSO
                    // ==================================

                    mensagem.textContent =
                        "✅ Senha redefinida com sucesso!";


                    form.reset();


                    botao.textContent =
                        "Senha alterada!";


                    // ==================================
                    // VOLTAR PARA LOGIN
                    // ==================================

                    setTimeout(() => {

                        window.location.href =
                            "/index.html";

                    }, 2000);


                } catch (erro) {

                    console.error(
                        "Erro ao redefinir senha:",
                        erro
                    );


                    mensagem.textContent =
                        "❌ " + erro.message;


                    botao.disabled =
                        false;


                    botao.textContent =
                        "Redefinir senha";

                }

            }
        );

    </script>


</body>

</html>
