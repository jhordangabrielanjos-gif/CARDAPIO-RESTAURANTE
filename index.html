<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardápio Restaurante</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         CABEÇALHO
    ================================= -->

    <header class="header">

        <div class="header-conteudo">

            <div class="logo">
                🍽️
                <div>
                    <h1>Meu Restaurante</h1>
                    <span>Cardápio online</span>
                </div>
            </div>

            <!-- BOTÃO DO CARRINHO -->

            <button id="abrirCarrinho" class="botao-carrinho">

                🛒

                <span>
                    Meu pedido
                </span>

                <strong id="contadorCarrinho">
                    0
                </strong>

            </button>

        </div>

    </header>


    <!-- ================================
         CONTEÚDO PRINCIPAL
    ================================= -->

    <main>

        <section class="hero">

            <div>

                <span class="hero-tag">
                    🍴 Faça seu pedido
                </span>

                <h2>
                    Nosso Cardápio
                </h2>

                <p>
                    Escolha seus pratos favoritos e monte seu pedido.
                </p>

            </div>

        </section>


        <!-- PESQUISA -->

        <section class="filtros">

            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Pesquisar prato..."
            >

            <div
                id="categorias"
                class="categorias">
            </div>

        </section>


        <!-- CONTADOR -->

        <div class="resultado">

            <span id="contador">
                Carregando pratos...
            </span>

        </div>


        <!-- LISTA DE PRATOS -->

        <section
            id="listaPratos"
            class="lista-pratos">

        </section>

    </main>


    <!-- ==================================================
         CARRINHO
         AGORA ELE ESTÁ DIRETAMENTE NO HTML
    =================================================== -->

    <div
        id="overlayCarrinho"
        class="overlay-carrinho">
    </div>


    <aside
        id="carrinho"
        class="carrinho">

        <!-- CABEÇALHO DO CARRINHO -->

        <div class="carrinho-header">

            <div>

                <span class="carrinho-icone">
                    🛒
                </span>

                <div>

                    <h2>
                        Meu pedido
                    </h2>

                    <small>
                        Confira seus itens
                    </small>

                </div>

            </div>


            <button
                id="fecharCarrinho"
                class="fechar-carrinho">

                ✕

            </button>

        </div>


        <!-- ITENS -->

        <div
            id="listaCarrinho"
            class="lista-carrinho">

            <div
                id="carrinhoVazio"
                class="carrinho-vazio">

                <div class="icone-vazio">
                    🛒
                </div>

                <h3>
                    Seu carrinho está vazio
                </h3>

                <p>
                    Adicione pratos para começar seu pedido.
                </p>

                <button
                    id="continuarComprando"
                    class="botao-continuar">

                    Ver cardápio

                </button>

            </div>

        </div>


        <!-- RODAPÉ DO CARRINHO -->

        <div class="carrinho-footer">

            <div class="linha-total">

                <span>
                    Total
                </span>

                <strong id="totalCarrinho">
                    R$ 0,00
                </strong>

            </div>


            <button
                id="finalizarPedido"
                class="botao-whatsapp"
                disabled>

                📱 Finalizar pelo WhatsApp

            </button>

            <button
                id="limparCarrinho"
                class="botao-limpar">

                🗑️ Limpar pedido

            </button>

        </div>

    </aside>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="script.js"></script>

</body>

</html>
